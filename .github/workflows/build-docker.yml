name: Build Docker

on:
  push:
  pull_request:

jobs:
  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag devops-maven-lab:${{ github.sha }} .

  publish:
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e pubblica l'immagine su GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  deploy:
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Installa Render CLI
        run: |
          curl -sL -o render-cli.zip "https://github.com/render-oss/cli/releases/download/v2.28.0/cli_2.28.0_linux_amd64.zip"
          unzip -q render-cli.zip "cli_v2.28.0"
          sudo install -m 0755 "cli_v2.28.0" /usr/local/bin/render

      - name: Deploy dell'immagine appena pubblicata
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          render deploys create "${{ vars.RENDER_SERVICE_ID }}" \
            --image "ghcr.io/${{ github.repository }}:latest" \
            --wait --confirm --output json
