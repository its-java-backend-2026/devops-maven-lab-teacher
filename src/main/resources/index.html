<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Maven Lab - Greeting Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(15, 23, 42, 0.9);
        }

        input[type="text"].invalid {
            border-color: var(--error-color);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.825rem;
            margin-top: 0.4rem;
            display: none;
            animation: fadeIn 0.2s ease-in-out;
        }

        .error-message.visible {
            display: block;
        }

        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 var(--primary-glow);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            margin-top: 1.75rem;
            padding: 1.25rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: none;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-box.visible {
            display: block;
        }

        .result-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .result-content {
            font-family: monospace;
            font-size: 1.05rem;
            color: var(--success-color);
            word-break: break-all;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">DevOps Maven Lab</span>
        <h1>Greeting Service</h1>
        <p class="subtitle">Inserisci il tuo nome per invocare il servizio backend GET /hello</p>
    </div>

    <form id="greetingForm" novalidate>
        <div class="form-group">
            <label for="nomeInput">Nome *</label>
            <input type="text" id="nomeInput" placeholder="Es. Mario" autocomplete="off">
            <div id="errorMsg" class="error-message">⚠️ Il campo nome non può essere vuoto!</div>
        </div>

        <button type="submit" id="submitBtn">
            <span>Saluta</span>
        </button>
    </form>

    <div id="resultBox" class="result-box">
        <div class="result-title">Risposta dal Server JSON</div>
        <div id="resultText" class="result-content"></div>
    </div>
</div>

<script>
    const form = document.getElementById('greetingForm');
    const input = document.getElementById('nomeInput');
    const errorMsg = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    input.addEventListener('input', () => {
        if (input.value.trim() !== '') {
            input.classList.remove('invalid');
            errorMsg.classList.remove('visible');
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nomeVal = input.value.trim();

        // Controllo campo vuoto
        if (!nomeVal) {
            input.classList.add('invalid');
            errorMsg.classList.add('visible');
            resultBox.classList.remove('visible');
            input.focus();
            return;
        }

        input.classList.remove('invalid');
        errorMsg.classList.remove('visible');

        try {
            const url = `/hello?nome=${encodeURIComponent(nomeVal)}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error ${response.status}`);
            }
            const data = await response.json();
            resultText.textContent = JSON.stringify(data, null, 2);
            resultBox.classList.add('visible');
        } catch (err) {
            resultText.style.color = '#ef4444';
            resultText.textContent = `Errore di connessione: ${err.message}`;
            resultBox.classList.add('visible');
        }
    });
</script>

</body>
</html>
